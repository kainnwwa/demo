{% extends "base.html" %}
{% block title %}Услуги{% endblock title %}

{% block main_content %}
    <h2>Список услуг</h2>
    <ul>
        {% for service in services %}
            <li>{{ service.name }} — {{ service.price }} руб.</li>
        {% empty %}
            <li>Услуг пока нет.</li>
        {% endfor %}
    </ul>
{% endblock main_content %}
